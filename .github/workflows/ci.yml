name: CI

on:
  merge_group:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate formatting patch
        id: formatting
        run: |
          set -euo pipefail
          npm run format
          git diff --binary > "$RUNNER_TEMP/prettier.patch"
          if test -s "$RUNNER_TEMP/prettier.patch"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload formatting patch
        if: steps.formatting.outputs.changed == 'true'
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prettier-patch-${{ github.sha }}
          path: ${{ runner.temp }}/prettier.patch
          retention-days: 3

      - name: Require formatted source
        run: git diff --exit-code

      - name: Run repository checks
        run: npm run check

      - name: Upload coverage
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: warn
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14

  required:
    name: CI required gate
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require validation
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          test "$VALIDATE_RESULT" = success
